# Builds Lujain in the cloud and publishes the APK as a GitHub Release you can download on your phone.
# 1.3.2: builds an UNSIGNED release APK only; signing happens elsewhere.
name: Build Lujain APK

on:
  push:
    branches: [ lujain-apk ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - name: Android SDK (preinstalled on the runner)
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null || true
      - uses: gradle/actions/setup-gradle@v5

      - name: Build UNSIGNED release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p out && cp app/build/outputs/apk/release/app-release-unsigned.apk out/Lujain-1.3.2-unsigned.apk
          ls -l out

      - name: Publish release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" out/* --target "${{ github.sha }}" --title "Lujain 1.3.2 unsigned (build ${{ github.run_number }})" \
            --notes "Unsigned release APK (not installable until signed)."

      - name: Keep a copy on branch apk-out
        run: |
          cd out && git init -q -b apk-out && git add . \
            && git -c user.name=lujain-bot -c user.email=bot@users.noreply.github.com commit -qm "APK build ${{ github.run_number }}" \
            && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk-out

      - name: Upload log on failure
        if: failure()
        run: echo "Build failed - see the steps above."
